# Rebuild the post-close review after the Shanghai day session and publish
# the same URL. Scheduled workflows run only from the default branch.
# 16:40, 17:30 and 20:10 Asia/Shanghai are 08:40, 09:30 and 12:10 UTC.
name: daily-review

on:
  schedule:
    - cron: "40 8 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "10 12 * * 1-5"
  push:
    branches: [master]
    paths:
      - .github/workflows/daily-review.yml
      - research/seat_position/build_review.py
      - research/seat_position/render_boards.py
      - research/seat_position/run_study.py
      - research/seat_position/requirements.txt
  workflow_dispatch:
    inputs:
      date:
        description: "Trading date YYYY-MM-DD. Empty uses today in Asia/Shanghai."
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-review
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fonts and packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei
          pip install -r research/seat_position/requirements.txt

      - name: Choose the trading date
        id: day
        env:
          REVIEW_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$REVIEW_DATE" ]; then
            DATE="$REVIEW_DATE"
          else
            DATE=$(TZ=Asia/Shanghai date +%F)
          fi
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date must be YYYY-MM-DD, got: $DATE"
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "building $DATE"

      - name: Build the review
        id: build
        working-directory: research/seat_position
        env:
          REVIEW_DATE: ${{ steps.day.outputs.date }}
        run: |
          set +e
          python3 build_review.py --date "$REVIEW_DATE" --require-seats
          code=$?
          set -e
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "build exit $code"

      - name: Commit the new page
        if: ${{ steps.build.outputs.status == '0' || steps.build.outputs.status == '2' }}
        env:
          REVIEW_DATE: ${{ steps.day.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/seat_position/product/review
          if git diff --cached --quiet; then
            echo "review files unchanged"
            exit 0
          fi
          git commit -m "Update the post-close review for ${REVIEW_DATE}"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload the site
        if: ${{ steps.build.outputs.status == '0' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: research/seat_position/product/review

      - name: Report a build that did not finish
        if: ${{ steps.build.outputs.status != '0' && steps.build.outputs.status != '2' }}
        run: exit 1

      - name: Keep yesterday when today's seats are not out
        if: ${{ steps.build.outputs.status == '2' }}
        run: |
          echo "Seat rankings were not ready. The public link still shows the previous complete day."
          exit 1

  deploy:
    needs: build
    if: ${{ needs.build.outputs.status == '0' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
