<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>期货席位日报</title>
  <style>
    body { margin: 0; background: #071222; color: #e8eef5; font-family: "PingFang SC", "Noto Sans SC", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 22px; margin: 8px 0; }
    p { color: #9db0c4; font-size: 14px; line-height: 1.6; }
    img { width: 100%; border-radius: 12px; margin: 14px 0; display: block; }
  </style>
</head>
<body>
  <main>
    <h1>期货席位日报</h1>
    <p>每个交易日更新一次，夜盘前换上当天的三张图。休市日保留上一交易日。数据来自交易所公布的会员持仓排名，只供对照加减仓，不构成投资建议。</p>
    <img src="samples/2026-10-09-retail.png" alt="三大家人">
    <img src="samples/2026-10-09-inst.png" alt="四大机构">
    <img src="samples/2026-10-09-foreign.png" alt="三大外资">
  </main>
</body>
</html>
